# Planetary UI Platform — Production Kubernetes Manifest
# Configures Self-Hosted K8s Deployments, HPA Pod Autoscaling & Resource Quotas.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: holokai-shell-deployment
  namespace: default
  labels:
    app: holokai-shell
    tier: frontend-os
spec:
  replicas: 3
  selector:
    matchLabels:
      app: holokai-shell
  template:
    metadata:
      labels:
        app: holokai-shell
    spec:
      containers:
        - name: shell-container
          image: holokai/shell:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: holokai-shell-hpa
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: holokai-shell-deployment
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
