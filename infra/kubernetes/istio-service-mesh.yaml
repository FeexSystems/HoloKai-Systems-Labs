# Planetary UI Platform — Istio Service Mesh & Circuit Breakers Manifest
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: holokai-virtualservice
  namespace: default
spec:
  hosts:
    - "holokai.systems"
  gateways:
    - holokai-gateway
  http:
    - match:
        - uri:
            prefix: /api/oracle
      route:
        - destination:
            host: holokai-bff-service
            port:
              number: 8000
    - match:
        - uri:
            prefix: /
      route:
        - destination:
            host: holokai-shell-service
            port:
              number: 3000
---
apiVersion: networking.istio.io/v1alpha3
kind: DestinationRule
metadata:
  name: holokai-bff-destinationrule
  namespace: default
spec:
  host: holokai-bff-service
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: 1024
      http:
        http1MaxPendingRequests: 100
        maxRequestsPerConnection: 10
    outlierDetection:
      consecutive5xxErrors: 3
      interval: 10s
      baseEjectionTime: 30s
      maxEjectionPercent: 50
