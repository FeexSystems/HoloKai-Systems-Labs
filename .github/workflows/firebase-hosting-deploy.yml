name: Deploy to Firebase Hosting on Push

on:
  push:
    branches:
      - main
      - master

jobs:
  build_and_deploy:
    name: Build and Deploy to Firebase Hosting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'holo-kai/package-lock.json'

      - name: Install Dependencies & Build Frontend
        run: |
          cd holo-kai
          npm ci
          npm run build

      - name: Deploy to Live Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_GEN_LANG_CLIENT_0948281794 }}'
          channelId: live
          projectId: gen-lang-client-0948281794
